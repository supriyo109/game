<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="con">
        <div class="score">
            <h3>PLAY TO <br>TEST YOUR <br>MEMORY</h3>
        </div>
        <div class="game">
            <h1>Simon Says Game</h1>
            <h2>Press PLAY button to start the game</h2>
            <div class="btnCon">
                <div class="line1">
                    <div class="btn red" id="red"></div>
                    <div class="btn blue" id="blue"></div>
                </div>
                <div class="line2">
                    <div class="btn purple" id="purple"></div>
                    <div class="btn yellow" id="yellow"></div>
                </div>
            </div>
            <button class="play"><b><i>PLAY</i></b></button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
